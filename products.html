<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Management Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 250px;
            --sidebar-collapsed-width: 70px;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #2c3e50;
            transition: width 0.3s ease;
            width: var(--sidebar-width);
            z-index: 1000;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            padding: 20px;
        }

        .main-content.collapsed {
            margin-left: var(--sidebar-collapsed-width);
        }

        .nav-link {
            color: #ecf0f1;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            transition: background-color 0.3s;
        }

        .nav-link:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .nav-link i {
            margin-right: 10px;
        }

        .sidebar-toggler {
            cursor: pointer;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .dashboard-cards .card {
            transition: transform 0.3s;
        }

        .dashboard-cards .card:hover {
            transform: scale(1.05);
        }

        .submenu {
            background-color: rgba(0,0,0,0.2);
            display: none;
        }

        .nav-item.has-submenu:hover .submenu {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-toggler text-center">
                <i class="fas fa-bars" id="sidebarToggle"></i>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="#"><i class="fas fa-home"></i><span class="sidebar-text">Dashboard</span></a>
                
                <div class="nav-item has-submenu">
                    <a class="nav-link" href="#"><i class="fas fa-users"></i><span class="sidebar-text">People</span></a>
                    <div class="submenu">
                        <a class="nav-link" href="#"><i class="fas fa-graduation-cap"></i><span class="sidebar-text">Students</span></a>
                        <a class="nav-link" href="#"><i class="fas fa-chalkboard-teacher"></i><span class="sidebar-text">Staff</span></a>
                    </div>
                </div>
                
                <a class="nav-link" href="#"><i class="fas fa-utensils"></i><span class="sidebar-text">Orders</span></a>
                <a class="nav-link" href="#"><i class="fas fa-chart-line"></i><span class="sidebar-text">Reports</span></a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="container-fluid">
            <h1 class="mb-4">Cafeteria Dashboard</h1>
            
            <div class="row dashboard-cards">
                <div class="col-md-3 mb-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-user-graduate fa-3x text-primary mb-3"></i>
                            <h5 class="card-title">Students Count</h5>
                            <p class="card-text display-6 text-primary">1,250</p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-chalkboard-teacher fa-3x text-success mb-3"></i>
                            <h5 class="card-title">Staff Count</h5>
                            <p class="card-text display-6 text-success">120</p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-shopping-cart fa-3x text-warning mb-3"></i>
                            <h5 class="card-title">Orders Today</h5>
                            <p class="card-text display-6 text-warning">345</p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3 mb-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-dollar-sign fa-3x text-info mb-3"></i>
                            <h5 class="card-title">Sales Today</h5>
                            <p class="card-text display-6 text-info">$4,560</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Weekly Sales</h5>
                            <p class="display-6 text-success">$24,890</p>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Monthly Sales</h5>
                            <p class="display-6 text-primary">$98,456</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarTexts = document.querySelectorAll('.sidebar-text');

            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('collapsed');
                
                // Hide/show text when collapsed
                sidebarTexts.forEach(text => {
                    text.style.display = sidebar.classList.contains('collapsed') ? 'none' : 'inline';
                });
            });
        });
    </script>
</body>
</html>
