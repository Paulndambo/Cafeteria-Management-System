<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Management Sidebar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --text-color: #ecf0f1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: linear-gradient(to bottom right, var(--primary-color), var(--secondary-color));
            transition: width 0.3s ease;
            z-index: 1000;
            overflow-x: hidden;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: rgba(0,0,0,0.1);
        }

        .sidebar-logo {
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .sidebar-toggle {
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .sidebar-toggle:hover {
            transform: rotate(180deg);
        }

        .nav-link {
            color: var(--text-color);
            display: flex;
            align-items: center;
            padding: 12px 15px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255,255,255,0.1);
        }

        .nav-link i {
            width: 25px;
            text-align: center;
            margin-right: 10px;
        }

        .sidebar.collapsed .nav-link span {
            display: none;
        }

        .sidebar.collapsed .sidebar-logo span {
            display: none;
        }

        .submenu {
            background-color: rgba(0,0,0,0.1);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .submenu.show {
            max-height: 500px;
        }

        .submenu .nav-link {
            padding-left: 45px;
            font-size: 0.9rem;
        }

        .dropdown-toggle::after {
            content: '\f107';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.3s;
        }

        .dropdown-toggle.collapsed::after {
            transform: translateY(-50%) rotate(-90deg);
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
            }
            .sidebar.show {
                width: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-utensils"></i>
                <span>JAWAKA</span>
            </div>
            <div class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <nav>
            <!-- Admin Role Navigation -->
            <div id="adminNavigation" style="display: block;">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="collapse" data-bs-target="#peopleSubmenu">
                            <i class="fas fa-users"></i>
                            <span>People</span>
                        </a>
                        <div class="submenu collapse" id="peopleSubmenu">
                            <a class="nav-link" href="#">
                                <i class="fas fa-graduation-cap"></i>
                                <span>Students</span>
                            </a>
                            <a class="nav-link" href="#">
                                <i class="fas fa-chalkboard-teacher"></i>
                                <span>Staff</span>
                            </a>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-wallet"></i>
                            <span>Student Wallets</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-shopping-cart"></i>
                            <span>POS</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-receipt"></i>
                            <span>Orders</span>
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="collapse" data-bs-target="#inventorySubmenu">
                            <i class="fas fa-database"></i>
                            <span>Inventory</span>
                        </a>
                        <div class="submenu collapse" id="inventorySubmenu">
                            <a class="nav-link" href="#">
                                <i class="fas fa-box-open"></i>
                                <span>Stock</span>
                            </a>
                            <a class="nav-link" href="#">
                                <i class="fas fa-clipboard-list"></i>
                                <span>Stock Logs</span>
                            </a>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-building"></i>
                            <span>Suppliers</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-cash-register"></i>
                            <span>Expenses</span>
                        </a>
                    </li>
                </ul>

                <hr class="my-3 text-white">

                <h6 class="px-3 text-white text-uppercase small">Reports</h6>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-file-invoice-dollar"></i>
                            <span>Sales Today</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-chart-line"></i>
                            <span>All Sales</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="sidebar-footer">
            <a href="#" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');

            // Sidebar toggle functionality
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
            });

            // Dropdown toggle for nav items with submenus
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    this.classList.toggle('collapsed');
                    const targetId = this.getAttribute('data-bs-target');
                    const submenu = document.querySelector(targetId);
                    submenu.classList.toggle('show');
                });
            });

            // Mobile sidebar toggle
            function toggleMobileSidebar() {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('show');
                }
            }
        });
    </script>
</body>
</html>
