<div class="modal fade" id="rechargeWalletAtOrderModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 1rem; border: 2px solid var(--pos-primary);">
        <div class="modal-header" style="background: linear-gradient(135deg, var(--pos-primary) 0%, var(--pos-accent) 100%); color: white; border-radius: 1rem 1rem 0 0;">
          <h1 class="modal-title fs-5 fw-bold">
            <i class="bi bi-cash-coin me-2"></i>
            Payment Required
          </h1>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
            <form action="{% url 'confirm-manual-order' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body" style="padding: 2rem;">
                <div class="student-info-section mb-3" style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); padding: 1rem; border-radius: 0.75rem; border: 2px solid var(--pos-border);">
                   <p class="mb-2" style="font-weight: 600; color: #0f172a;">
                     <i class="bi bi-person-fill me-2" style="color: var(--pos-primary);"></i>
                     <strong>Student:</strong> {{student.user.name}}
                   </p>
                   <p class="mb-0" style="font-weight: 600; color: #0f172a;">
                     <i class="bi bi-card-text me-2" style="color: var(--pos-primary);"></i>
                     <strong>Reg. Number:</strong> {{student.registration_number}}
                   </p>
                </div>

                <div class="payment-breakdown mb-3" style="background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); padding: 1rem; border-radius: 0.75rem; border: 2px solid var(--pos-warning);">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span style="font-weight: 600; color: #78350f;">
                      <i class="bi bi-cart-check me-2"></i>Order Total:
                    </span>
                    <span style="font-weight: 700; font-size: 1.1rem; color: #78350f;">KSh {{order_value}}</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span style="font-weight: 600; color: #78350f;">
                      <i class="bi bi-wallet2 me-2"></i>Wallet Balance:
                    </span>
                    <span style="font-weight: 700; font-size: 1.1rem; color: #78350f;">- KSh {{student.wallet_balance}}</span>
                  </div>
                  <hr style="border-top: 2px solid var(--pos-warning); margin: 0.75rem 0;">
                  <div class="d-flex justify-content-between align-items-center">
                    <span style="font-weight: 700; color: #78350f; font-size: 1.1rem;">
                      <i class="bi bi-cash-stack me-2"></i>Amount to Pay:
                    </span>
                    <span style="font-weight: 800; font-size: 1.5rem; color: var(--pos-danger);">KSh {{extra_amount}}</span>
                  </div>
                </div>
                
                <div class="mb-2">
                  <input
                    type="text"
                    class="form-control"
                    id="student_id"
                    name="student_id"
                    value="{{student.id}}"
                    required
                    hidden
                    readonly
                  />
                </div>
                
                  <div class="mb-3">
                    <label for="amount" class="form-label fw-bold" style="color: #0f172a;">
                      <i class="bi bi-currency-exchange me-2" style="color: var(--pos-primary);"></i>
                      Amount to Pay (Cash/Mpesa)
                    </label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="amount"
                      name="amount"
                      value="{{extra_amount}}"
                      required
                      min="1"
                      readonly
                      style="border: 2px solid var(--pos-primary); font-weight: 700; font-size: 1.25rem; text-align: center; background: #f8fafc;"
                    />
                    <small class="text-muted mt-1 d-block">
                      <i class="bi bi-info-circle me-1"></i>
                      This is the difference between order total and wallet balance
                    </small>
                  </div>
                
                  <div class="mb-3">
                    <label for="recharge_method" class="form-label fw-bold" style="color: #0f172a;">
                      <i class="bi bi-credit-card me-2" style="color: var(--pos-primary);"></i>
                      Payment Method
                    </label>
                    <select class="form-select form-select-lg" id="recharge_method" name="recharge_method" style="border: 2px solid var(--pos-primary); font-weight: 600;">
                        <option value="Mpesa">💳 Mpesa</option>
                        <option value="Cash">💵 Cash</option>
                      </select>
                  </div>
                  
                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-success btn-lg w-100" style="padding: 0.75rem; font-weight: 700; border-radius: 0.75rem;">
                    <i class="bi bi-check-circle me-2"></i>
                    Confirm Payment & Place Order
                  </button>
                </div>
              </div>
              </form>
      </div>
    </div>
  </div>
