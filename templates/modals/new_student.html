<div class="modal fade" id="newStudentModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5 text-center">Add Student</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
            <form action="{% url 'new-student' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                  <div class="row mb-4">
                    <div class="col">
                  <label for="exampleInputPassword1" class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="first_name"
                    name="first_name"
                    required
                  />
                </div>
                <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Last Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="last_name"
                      name="last_name"
                      required
                    />
                  </div>
                </div>

                <div class="row mb-4">
                    <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Reg. Number</label>
                    <input
                      type="text"
                      class="form-control"
                      id="reg_number"
                      name="reg_number"
                      required
                    />
                  </div>
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Phone Number</label>
                    <input
                      type="text"
                      class="form-control"
                      id="phone_number"
                      name="phone_number"
                      required
                    />
                  </div>
                
                </div>
                

                <div class="row mb-4">
                  <div class="col">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender">
                    {% for gender in gender_options %}
                        <option value="{{ gender }}">{{ gender }}</option>
                    {% endfor %}
                    </select>
                  </div>

                  <div class="col">
                    <label class="form-label">Quota Group</label>
                    <select class="form-select" id="quota_group" name="quota_group">
                        {% for group in quota_groups %}
                        <option value="{{ group.id }}">{{ group.description }}</option>
                        {% endfor %}
                      </select>
                  </div>
                </div>
                  
                
                <div class="text-center mt-2">
                  <button type="submit" class="btn btn-primary">Submit Student</button>
                </div>
              </div>
              </form>
      </div>
    </div>
  </div>
