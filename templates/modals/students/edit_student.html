<div class="modal fade" id="editStudentModal{{student.id}}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5 text-center">Edit Student</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
            <form action="{% url 'edit-student' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                <div class="mb-2">
                    
                    <input
                        type="text"
                        class="form-control"
                        id="student_id"
                        name="student_id"
                        value="{{student.id}}"
                        hidden
                        required
                    />
                    </div>
                  
                    <div class="mb-2">
           
                    <input
                        type="text"
                        class="form-control"
                        id="user_id"
                        name="user_id"
                        value="{{student.user.id}}"
                        hidden
                        required
                    />
                    </div>
                <div class="row mb-4">
                  <div class="col">
                  <label for="exampleInputPassword1" class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="first_name"
                    name="first_name"
                    value="{{student.user.first_name}}"
                    required
                  />
                </div>
                <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Last Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="last_name"
                      name="last_name"
                      value="{{student.user.last_name}}"
                      required
                    />
                  </div>    
                </div>
                <div class="row mb-4">
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Reg. Number</label>
                    <input
                      type="text"
                      class="form-control"
                      id="reg_number"
                      name="reg_number"
                      value="{{student.registration_number}}"
                      required
                    />
                  </div>
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">ID Number</label>
                    <input
                      type="text"
                      class="form-control"
                      id="id_number"
                      value="{{student.user.id_number}}"
                      name="id_number"
                    />
                  </div>
                </div>
                
                <div class="row mb-4">
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Phone Number</label>
                    <input
                      type="text"
                      class="form-control"
                      id="phone_number"
                      name="phone_number"
                      value="{{student.user.phone_number}}"
                      required
                    />
                  </div>
                  <div class="col">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender" value="{{student.gender}}">
                        {% for gender in gender_options %}
                            <option value="{{ gender }}" {% if gender == student.user.gender %}selected{% endif %}>
                                {{ gender }}
                            </option>
                        {% endfor %}
                      </select>
                  </div>
                </div>
                
                <div class="row mb-4">
                  <div class="col">
                    <label class="form-label">Quota Group</label>
                    <select class="form-select" id="quota_group" name="quota_group" value="{{student.quota_group}}">
                        {% for group in quota_groups %}
                            <option value="{{ group.id }}" {% if group.id == student.quota_group.id %}selected{% endif %}>
                                {{ group.description }}
                            </option>
                        {% endfor %}
    
                      </select>
                  </div>
                </div>
            
                
                <div class="text-center mt-2">
                  <button type="submit" class="btn btn-primary">Submit Student</button>
                </div>
              </div>
              </form>
      </div>
    </div>
  </div>
