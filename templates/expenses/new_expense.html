<div class="modal fade" id="newExpenseModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5 text-center">New Expense</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
            <form action="{% url 'new-expense' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                <div class="mb-4">
                  <label for="exampleInputPassword1" class="form-label">Expense Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    name="title"
                    required
                  />
                </div>

      
                <div class="row mb-4">
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Amount</label>
                    <input
                      type="number"
                      class="form-control"
                      id="amount"
                      name="amount"
                      required
                    />
                  </div>

                  <div class="col">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" id="payment_method" name="payment_method">
                        {% for method in payment_methods %}
                        <option value="{{ method }}">{{ method }}</option>
                        {% endfor %}
                      </select>
                  </div>
                </div>
             
                <div class="row mb-4">
                  <div class="col">
                    <label for="exampleInputPassword1" class="form-label">Expense Date</label>
                    <input
                      type="date"
                      class="form-control"
                      id="expense_date"
                      name="expense_date"
                      required
                    />
                  </div>

                  
                </div>
                
                <div class="text-center mt-2">
                  <button type="submit" class="btn btn-primary">Submit Expense</button>
                </div>
              </div>
              </form>
      </div>
    </div>
  </div>
