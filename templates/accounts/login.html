{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="JAWAKA Cafeteria Management System">
        <title>LOGIN | JAWAKA CAFETERIA</title>

        <link href="{% static 'forms/css/app.css' %}" rel="stylesheet">
        <link href="{% static 'dashboard.css' %}" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        
        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Inter', sans-serif;
            }
            
            .login-container {
                position: relative;
                z-index: 1;
            }
            
            .login-card {
                background: white;
                border-radius: 1.5rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
                border: none;
                overflow: hidden;
            }
            
            .login-header {
                background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
                padding: 2rem;
                text-align: center;
                color: white;
            }
            
            .login-header i {
                font-size: 3rem;
                margin-bottom: 1rem;
                opacity: 0.9;
            }
            
            .login-header h3 {
                font-weight: 700;
                margin: 0;
                font-size: 1.75rem;
            }
            
            .login-body {
                padding: 2rem;
            }
            
            .form-control-lg {
                border-radius: 0.75rem;
                border: 2px solid #e5e7eb;
                padding: 0.875rem 1.25rem;
                transition: all 0.3s ease;
            }
            
            .form-control-lg:focus {
                border-color: #6366f1;
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            }
            
            .btn-login {
                background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
                border: none;
                border-radius: 0.75rem;
                padding: 0.875rem 2rem;
                font-weight: 600;
                font-size: 1rem;
                color: white;
                width: 100%;
                transition: all 0.3s ease;
            }
            
            .btn-login:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            }
            
            .form-label {
                font-weight: 500;
                color: #374151;
                margin-bottom: 0.5rem;
            }
            
            .form-check-label {
                color: #6b7280;
                font-size: 0.875rem;
            }
            
            .forgot-password {
                color: #6366f1;
                text-decoration: none;
                font-size: 0.875rem;
                transition: color 0.3s ease;
            }
            
            .forgot-password:hover {
                color: #4f46e5;
            }
            
            .decoration-shape {
                position: absolute;
                width: 200px;
                height: 200px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.1);
                z-index: 0;
            }
            
            .decoration-shape-1 {
                top: -100px;
                right: -100px;
            }
            
            .decoration-shape-2 {
                bottom: -100px;
                left: -100px;
            }
        </style>
    </head>

    <body>
        <div class="decoration-shape decoration-shape-1"></div>
        <div class="decoration-shape decoration-shape-2"></div>
        
        <main class="d-flex w-100 login-container">
            <div class="container d-flex flex-column">
                <div class="row vh-100">
                    <div class="col-sm-10 col-md-8 col-lg-5 mx-auto d-table h-100">
                        <div class="d-table-cell align-middle">
                            <div class="card login-card fade-in">
                                <div class="login-header">
                                    <i class="bi bi-cup-hot-fill"></i>
                                    <h3>JAWAKA CAFETERIA</h3>
                                    <p class="mb-0 mt-2" style="opacity: 0.9;">Management System</p>
                                </div>
                                <div class="login-body">
                                    <form action="" method="POST">
                                        {% csrf_token %}
                                        <div class="mb-4">
                                            <label class="form-label">
                                                <i class="bi bi-person-fill me-2"></i>Username
                                            </label>
                                            <input class="form-control form-control-lg" type="text" name="username"
                                                placeholder="Enter your username" required />
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                <i class="bi bi-lock-fill me-2"></i>Password
                                            </label>
                                            <input class="form-control form-control-lg" type="password"
                                                name="password" placeholder="Enter your password" required />
                                            <div class="d-flex justify-content-between align-items-center mt-2">
                                                <label class="form-check mb-0">
                                                    <input class="form-check-input" type="checkbox" value="remember-me"
                                                        name="remember-me" checked>
                                                    <span class="form-check-label">
                                                        Remember me
                                                    </span>
                                                </label>
                                                <a href="#" class="forgot-password">Forgot password?</a>
                                            </div>
                                        </div>
                                        <div class="text-center mt-4">
                                            <button type="submit" class="btn btn-login">
                                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                                LOGIN
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="{% static 'forms/js/app.js' %}"></script>
    </body>

</html>
